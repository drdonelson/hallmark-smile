<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Lucid ROI — Smile Simulator Leads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Josefin+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#07080D; --bg2:#0E1120; --card:rgba(255,255,255,.04);
    --blue:#6B8FFF; --blue-d:#5070e8;
    --line:rgba(255,255,255,.08); --muted:rgba(155,178,220,.55); --body:rgba(195,215,250,.84);
    --text:#EEF2FF;
    --new:#6B8FFF; --contacted:#d4a730; --booked:#3DD68C; --closed:rgba(155,178,220,.5);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--body);font-family:'Inter',-apple-system,sans-serif;font-size:15px}
  a{color:var(--blue)}
  .hidden{display:none!important}
  /* login */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
  .login{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:34px 30px;width:100%;max-width:380px;box-shadow:0 24px 80px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.04);text-align:center;backdrop-filter:blur(20px)}
  .brand-mark{display:inline-flex;align-items:center;gap:10px;color:var(--text)}
  .brand-name{font-family:'Josefin Sans','Inter',sans-serif;font-weight:300;font-size:1.25rem;letter-spacing:.3em;text-transform:uppercase;line-height:1}
  .sub{color:var(--muted);font-size:.86rem;margin:6px 0 24px}
  .login input{width:100%;padding:12px 14px;border:1px solid rgba(255,255,255,.1);border-radius:10px;font-size:15px;margin-bottom:12px;background:rgba(255,255,255,.06);color:var(--text)}
  .login input::placeholder{color:rgba(155,178,220,.45)}
  .login input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(100,130,255,.15)}
  .btn{background:var(--blue);color:#fff;border:none;border-radius:10px;padding:12px 18px;font-weight:700;font-size:15px;cursor:pointer;width:100%;transition:.15s}
  .btn:hover{background:var(--blue-d)} .btn:disabled{opacity:.5;cursor:not-allowed}
  .err{color:#f87171;font-size:.84rem;margin-top:10px;min-height:18px}
  /* app */
  header.top{background:#04050A;border-bottom:1px solid rgba(255,255,255,.07);color:#fff;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
  header .brand-mark{color:#fff}
  .top-right{display:flex;align-items:center;gap:14px;font-size:.85rem}
  .top-right a{color:rgba(155,178,220,.6);cursor:pointer;text-decoration:none} .top-right a:hover{color:#fff}
  .wrap{max-width:1320px;margin:0 auto;padding:18px 16px 60px;background:var(--bg);min-height:calc(100vh - 53px)}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  .toolbar input,.toolbar select{padding:9px 12px;border:1px solid rgba(255,255,255,.1);border-radius:9px;font-size:14px;background:rgba(255,255,255,.05);color:var(--text)}
  .toolbar input::placeholder{color:rgba(155,178,220,.4)}
  .toolbar input{flex:1;min-width:160px;max-width:340px}
  .count{color:var(--muted);font-size:.85rem;margin-left:auto}
  /* board */
  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .column{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:13px;padding:10px;display:flex;flex-direction:column;min-height:160px}
  .column.drag-over{outline:2px dashed var(--blue);outline-offset:-3px;background:rgba(100,130,255,.07)}
  .col-head{display:flex;align-items:center;gap:8px;padding:4px 6px 11px;font-weight:700;color:var(--text);font-size:.92rem}
  .col-dot{width:9px;height:9px;border-radius:50%;flex:none}
  .col-count{margin-left:auto;background:rgba(255,255,255,.07);color:var(--muted);font-size:.74rem;font-weight:700;border-radius:99px;padding:2px 9px}
  .col-body{display:flex;flex-direction:column;gap:10px;flex:1}
  .kcard{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:11px;padding:12px;box-shadow:0 2px 8px rgba(0,0,0,.3);cursor:grab;transition:border-color .15s,background .15s}
  .kcard:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.13)}
  .kcard:active{cursor:grabbing} .kcard.dragging{opacity:.45}
  .kc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
  .kc-name{font-weight:700;color:var(--text);font-size:.98rem;line-height:1.2}
  .kc-practice{font-size:.68rem;color:var(--blue);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
  .kc-meta{color:var(--body);font-size:.82rem;margin:7px 0 3px;line-height:1.45;word-break:break-word}
  .kc-meta a{text-decoration:none}
  .kc-date{color:var(--muted);font-size:.72rem}
  .kc-ba{display:flex;gap:6px;margin:10px 0 2px}
  .kc-ba figure{margin:0;flex:1;text-align:center}
  .kc-ba img{width:100%;height:64px;object-fit:cover;border-radius:7px;border:1px solid rgba(255,255,255,.1);cursor:zoom-in;background:rgba(255,255,255,.04)}
  .kc-ba figcaption{font-size:.6rem;color:var(--muted);font-weight:600;margin-top:2px;text-transform:uppercase;letter-spacing:.03em}
  .kc-pending{color:var(--muted);font-size:.72rem;margin-top:8px}
  .kc-foot{display:flex;align-items:center;gap:4px;margin-top:11px;padding-top:9px;border-top:1px solid rgba(255,255,255,.07)}
  .mv{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:var(--text);border-radius:7px;width:26px;height:26px;font-size:15px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .mv:hover{background:rgba(100,130,255,.15);border-color:var(--blue)} .mv:disabled{opacity:.35;cursor:default}
  .kc-foot .vid{font-size:.78rem;font-weight:600;text-decoration:none;margin-left:4px}
  .kc-foot .spacer{flex:1}
  .del{background:none;border:none;color:rgba(155,178,220,.4);cursor:pointer;padding:5px;border-radius:7px;display:flex}
  .del:hover{color:#f87171;background:rgba(248,113,113,.1)}
  .col-empty{color:var(--muted);font-size:.78rem;text-align:center;padding:18px 8px;opacity:.7}
  .skeleton{height:300px;border-radius:13px;background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.08),rgba(255,255,255,.04));background-size:200% 100%;animation:sk 1.3s linear infinite}
  @keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
  /* lightbox + toast */
  .lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  .lb.open{display:flex} .lb img{max-width:92vw;max-height:88vh;border-radius:10px}
  .lb-close{position:absolute;top:18px;right:24px;color:#fff;font-size:30px;cursor:pointer;line-height:1}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0E1120;border:1px solid rgba(255,255,255,.12);color:#fff;padding:10px 18px;border-radius:10px;font-size:.85rem;opacity:0;transition:.2s;pointer-events:none;z-index:60}
  .toast.show{opacity:1}
  @media(max-width:820px){
    .board{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:78%;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px}
    .column{scroll-snap-align:start}
  }
</style>
</head>
<body>

  <form class="login" id="loginForm">
    <div class="brand-mark" aria-label="Lucid">
      <svg viewBox="0 0 200 200" width="28" height="28" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polygon stroke-width="5" points="100,12 176,56 176,144 100,188 24,144 24,56"/>

</div>

<div class="hidden" id="appView">
  <header class="top">
    <div class="brand-mark" aria-label="Lucid">
      <svg viewBox="0 0 200 200" width="28" height="28" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polygon stroke-width="5" points="100,12 176,56 176,144 100,188 24,144 24,56"/>
        <line stroke-width="2.8" x1="100" y1="12" x2="130" y2="48"/><line stroke-width="2.8" x1="100" y1="12" x2="70" y2="48"/>
        <line stroke-width="2.8" x1="176" y1="56" x2="130" y2="48"/><line stroke-width="2.8" x1="176" y1="56" x2="160" y2="100"/>
        <line stroke-width="2.8" x1="176" y1="144" x2="160" y2="100"/><line stroke-width="2.8" x1="176" y1="144" x2="130" y2="152"/>
        <line stroke-width="2.8" x1="100" y1="188" x2="130" y2="152"/><line stroke-width="2.8" x1="100" y1="188" x2="70" y2="152"/>
        <line stroke-width="2.8" x1="24" y1="144" x2="70" y2="152"/><line stroke-width="2.8" x1="24" y1="144" x2="40" y2="100"/>
        <line stroke-width="2.8" x1="24" y1="56" x2="40" y2="100"/><line stroke-width="2.8" x1="24" y1="56" x2="70" y2="48"/>
        <polygon stroke-width="2.8" points="160,100 130,48 70,48 40,100 70,152 130,152"/>
        <line stroke-width="2.2" x1="160" y1="100" x2="133" y2="81"/><line stroke-width="2.2" x1="160" y1="100" x2="133" y2="119"/>
        <line stroke-width="2.2" x1="130" y1="48" x2="100" y2="62"/><line stroke-width="2.2" x1="130" y1="48" x2="133" y2="81"/>
        <line stroke-width="2.2" x1="70" y1="48" x2="67" y2="81"/><line stroke-width="2.2" x1="70" y1="48" x2="100" y2="62"/>
        <line stroke-width="2.2" x1="40" y1="100" x2="67" y2="119"/><line stroke-width="2.2" x1="40" y1="100" x2="67" y2="81"/>
        <line stroke-width="2.2" x1="70" y1="152" x2="100" y2="138"/><line stroke-width="2.2" x1="70" y1="152" x2="67" y2="119"/>
        <line stroke-width="2.2" x1="130" y1="152" x2="133" y2="119"/><line stroke-width="2.2" x1="130" y1="152" x2="100" y2="138"/>

      <span class="brand-name">LUCID</span>

    <div class="top-right">

<div class="lb" id="lightbox"><span class="lb-close" id="lbClose">&times;</span><img id="lbImg" alt=""></div>
<div class="toast" id="toast"></div>

<script>
// Force HTTPS — the API only accepts the secure origin; over http the call is blocked.
if (location.protocol === 'http:' && location.hostname !== 'localhost') {
  location.replace(location.href.replace(/^http:/, 'https:'));
}
const API = 'https://quiet-forest-e1f8.david-d73.workers.dev';
const $ = id => document.getElementById(id);
const STAGES = [
  { key:'new',       label:'New leads', color:'var(--new)' },
  { key:'contacted', label:'Contacted', color:'var(--contacted)' },
  { key:'booked',    label:'Booked',    color:'var(--booked)' },
  { key:'closed',    label:'Closed',    color:'var(--closed)' },
];
let token = sessionStorage.getItem('lucid_dash_token') || null;
let scope = sessionStorage.getItem('lucid_dash_scope') || null;
let leads = [];

function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtDate(ts){ if(!ts) return ''; const d=new Date(ts); return isNaN(d)?'':d.toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}); }
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200); }
function api(path, opts={}){ return fetch(`${API}${path}`, { ...opts, headers:{ ...(opts.headers||{}), Authorization:`Bearer ${token}` } }); }

/* ── Login ── */
$('loginForm').addEventListener('submit', async e=>{
  e.preventDefault(); $('loginErr').textContent=''; $('loginBtn').disabled=true;
  try{
    const tenant = new URLSearchParams(location.search).get('t') || '';
    const r = await fetch(`${API}/api/dashboard/login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('pw').value, ...(tenant && {tenant})})});
    const d = await r.json();
    if(!r.ok) throw new Error(d.error||'Sign-in failed');
    token=d.token; scope=d.scope;
    sessionStorage.setItem('lucid_dash_token',token);
    sessionStorage.setItem('lucid_dash_scope',scope);
    showApp();
  }catch(err){ $('loginErr').textContent=err.message; }
  finally{ $('loginBtn').disabled=false; }
});
function logout(){ sessionStorage.removeItem('lucid_dash_token'); sessionStorage.removeItem('lucid_dash_scope'); token=scope=null; $('appView').classList.add('hidden'); $('loginView').classList.remove('hidden'); }
$('logoutBtn').addEventListener('click',logout);
$('refreshBtn').addEventListener('click',loadLeads);

async function showApp(){
  $('loginView').classList.add('hidden'); $('appView').classList.remove('hidden');
  $('scopeLabel').textContent = scope==='*' ? 'All practices' : scope;
  if(scope==='*') $('practiceFilter').classList.remove('hidden');
  await loadLeads();
}

async function loadLeads(){
  $('board').innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
  try{
    const r = await api('/api/dashboard/leads');
    if(r.status===401) return logout();
    const d = await r.json();
    leads = d.leads||[];
    if(scope==='*'){
      const ps=[...new Set(leads.map(l=>l.practice).filter(Boolean))].sort();
      $('practiceFilter').innerHTML = '<option value="">All practices</option>'+ps.map(p=>`<option value="${esc(p)}">${esc(p)}</option>`).join('');
    }
    render();
  }catch{ $('board').innerHTML = '<div class="col-empty" style="grid-column:1/-1">Couldn\'t load leads — tap Refresh.</div>'; }
}

function visibleLeads(){
  const q=$('search').value.trim().toLowerCase(), pf=$('practiceFilter').value;
  return leads.filter(l=>{
    if(pf && l.practice!==pf) return false;
    if(q){ const hay=`${l.firstName||''} ${l.lastName||''} ${l.email||''} ${l.phone||''} ${l.interest||''}`.toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  });
}

function render(){
  const rows = visibleLeads();
  $('count').textContent = `${rows.length} lead${rows.length===1?'':'s'}`;
  const byStage = Object.fromEntries(STAGES.map(s=>[s.key,[]]));
  rows.forEach(l=>{ const st=STAGES.some(s=>s.key===l.status)?l.status:'new'; byStage[st].push(l); });
  $('board').innerHTML = STAGES.map(s=>`
    <div class="column" data-stage="${s.key}">
      <div class="col-head"><span class="col-dot" style="background:${s.color}"></span>${s.label}<span class="col-count">${byStage[s.key].length}</span></div>
      <div class="col-body">
        ${byStage[s.key].map(cardHTML).join('') || '<div class="col-empty">—</div>'}
      </div>
    </div>`).join('');
  wire();
}

function cardHTML(l){
  const idx = STAGES.findIndex(s=>s.key===(l.status||'new'));
  const name = esc(`${l.firstName||''} ${l.lastName||''}`.trim()||'Unknown');
  const ba = (l.beforeUrl||l.afterUrl) ? `
    <div class="kc-ba">
      ${l.beforeUrl?`<figure><img src="${esc(l.beforeUrl)}" alt="Before"><figcaption>Before</figcaption></figure>`:''}
      ${l.afterUrl?`<figure><img src="${esc(l.afterUrl)}" alt="After"><figcaption>After</figcaption></figure>`:''}
    </div>` : '<div class="kc-pending">Visualization pending…</div>';
  return `<div class="kcard" draggable="true" data-id="${esc(l.id)}" data-tenant="${esc(l.tenant)}">
    <div class="kc-top">
      <div>
        ${scope==='*'&&l.practice?`<div class="kc-practice">${esc(l.practice)}</div>`:''}
        <div class="kc-name">${name}</div>
      </div>
    </div>
    <div class="kc-meta">
      ${l.email?`<a href="mailto:${esc(l.email)}">${esc(l.email)}</a><br>`:''}
      ${l.phone?`<a href="tel:${esc(l.phone)}">${esc(l.phone)}</a>${l.interest?' · ':''}`:''}${esc(l.interest||'')}
    </div>
    <div class="kc-date">${fmtDate(l.ts)}</div>
    ${ba}
    <div class="kc-foot">
      <button class="mv" data-dir="-1" ${idx<=0?'disabled':''} title="Move back">‹</button>
      <button class="mv" data-dir="1" ${idx>=STAGES.length-1?'disabled':''} title="Move forward">›</button>
      ${l.videoUrl?`<a class="vid" href="${esc(l.videoUrl)}" target="_blank" rel="noopener">▶ Video</a>`:''}
      <span class="spacer"></span>
      <button class="del" title="Delete lead"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2m-9 0 1 14h8l1-14"/></svg></button>
    </div>
  </div>`;
}

/* ── Interactions ── */
function findLead(id){ return leads.find(l=>l.id===id); }

async function setStatus(id, status){
  const l = findLead(id); if(!l || l.status===status) return;
  const prev = l.status; l.status = status; render();
  try{
    const r = await api('/api/dashboard/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,tenant:l.tenant,status})});
    if(!r.ok){ l.status=prev; render(); toast('Could not move lead'); }
  }catch{ l.status=prev; render(); toast('Could not move lead'); }
}

async function delLead(id){
  const l = findLead(id); if(!l) return;
  if(!confirm(`Delete ${l.firstName||'this'} ${l.lastName||'lead'}? This cannot be undone.`)) return;
  leads = leads.filter(x=>x.id!==id); render();
  try{ const r=await api('/api/dashboard/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,tenant:l.tenant})}); if(!r.ok) throw 0; toast('Lead deleted'); }
  catch{ toast('Delete failed — refreshing'); loadLeads(); }
}

function wire(){
  // move buttons
  document.querySelectorAll('.mv').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation();
    const card=b.closest('.kcard'), id=card.dataset.id, l=findLead(id);
    const idx=STAGES.findIndex(s=>s.key===(l.status||'new'))+Number(b.dataset.dir);
    if(STAGES[idx]) setStatus(id, STAGES[idx].key);
  }));
  // delete
  document.querySelectorAll('.del').forEach(b=>b.addEventListener('click',e=>{ e.stopPropagation(); delLead(b.closest('.kcard').dataset.id); }));
  // thumbnails
  document.querySelectorAll('.kc-ba img').forEach(img=>img.addEventListener('click',()=>openLb(img.src)));
  // drag and drop
  let dragId=null;
  document.querySelectorAll('.kcard').forEach(card=>{
    card.addEventListener('dragstart',e=>{ dragId=card.dataset.id; card.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; });
    card.addEventListener('dragend',()=>card.classList.remove('dragging'));
  });
  document.querySelectorAll('.column').forEach(col=>{
    col.addEventListener('dragover',e=>{ e.preventDefault(); col.classList.add('drag-over'); });
    col.addEventListener('dragleave',()=>col.classList.remove('drag-over'));
    col.addEventListener('drop',e=>{ e.preventDefault(); col.classList.remove('drag-over'); if(dragId) setStatus(dragId, col.dataset.stage); dragId=null; });
  });
}

['search','practiceFilter'].forEach(id=>$(id).addEventListener('input',render));

/* ── Lightbox ── */
function openLb(src){ $('lbImg').src=src; $('lightbox').classList.add('open'); }
$('lbClose').addEventListener('click',()=>$('lightbox').classList.remove('open'));
$('lightbox').addEventListener('click',e=>{ if(e.target===$('lightbox')) $('lightbox').classList.remove('open'); });

/* ── Boot ── */
if(token && scope) showApp();
</script>
</body>
</html>
